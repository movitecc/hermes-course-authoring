version: "2.4"

services:
  learning-web:
    build: .
    container_name: hermes-learning-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "3001"
      LEARNING_DB: /app/data/learning.sqlite3
    volumes:
      - learning_data:/app/data
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  learning_data:
