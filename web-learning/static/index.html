<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes 互动学习</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--card:#151d35;--muted:#aab5d2;--accent:#7dd3fc;--ok:#86efac}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#0b1020,#101a35);font:16px/1.65 system-ui,sans-serif;color:#edf2ff}header{padding:28px max(20px,calc((100% - 1100px)/2));border-bottom:1px solid #263353}main{max-width:1100px;margin:24px auto;padding:0 20px}.layout{display:grid;grid-template-columns:280px 1fr;gap:22px}.card{background:#151d35;border:1px solid #29385f;border-radius:14px;padding:20px;box-shadow:0 8px 30px #0003}button{border:0;border-radius:9px;padding:10px 14px;background:#2563eb;color:white;cursor:pointer}button:hover{background:#3b82f6}.lesson{display:block;width:100%;text-align:left;background:transparent;color:#dbeafe;margin:5px 0}.lesson.active{background:#263b68}.muted{color:var(--muted)}h1{margin:0 0 4px}h2{color:var(--accent)}h3{margin-bottom:5px}.pill{display:inline-block;background:#1e3a5f;color:#bae6fd;padding:3px 9px;border-radius:999px;font-size:13px;margin:3px}.exercise{margin-top:22px;border-top:1px solid #314264;padding-top:18px}textarea{width:100%;min-height:120px;background:#0d1428;color:white;border:1px solid #3b4c75;border-radius:8px;padding:12px;font:inherit}.feedback{color:var(--ok);margin-top:10px}.progress{height:8px;background:#29385f;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:var(--ok);width:0} @media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{order:2}}
</style></head>
<body><header><h1>Hermes 互动学习</h1><div class="muted" id="subtitle">正在加载课程…</div></header><main><div class="layout"><aside class="card sidebar"><h3>课程目录</h3><div class="progress"><i id="bar"></i></div><p class="muted" id="status">进度加载中…</p><div id="lessons"></div></aside><section class="card"><div id="content">正在加载…</div></section></div></main>
<script>
let course, current=0, progress={}; const learner=localStorage.getItem('hermes_learner')||(()=>{let id='learner-'+crypto.randomUUID(); localStorage.setItem('hermes_learner',id); return id})();
const BASE=location.pathname.startsWith('/learn')?'/learn':'';
async function get(url, opt){let r=await fetch(BASE+url,opt); if(!r.ok) throw Error(await r.text()); return r.json()}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderNav(){let done=Object.values(progress).filter(x=>x.completed).length; let total=course.lessons.reduce((n,l)=>n+(l.exercises||[]).length,0); document.getElementById('status').textContent=`已完成 ${done}/${total} 个练习`; document.getElementById('bar').style.width=(total?done/total*100:0)+'%'; document.getElementById('lessons').innerHTML=course.lessons.map((l,i)=>`<button class="lesson ${i===current?'active':''}" onclick="selectLesson(${i})">${i+1}. ${esc(l.title)}</button>`).join('')}
function render(){let l=course.lessons[current], ex=(l.exercises||[])[0], key=l.id+':'+(ex?.id||'lesson'), old=progress[key]?.answer||''; document.getElementById('content').innerHTML=`<h2>${esc(l.title)}</h2><p class="muted">第 ${current+1} 课 / 共 ${course.lessons.length} 课</p><div>${(l.keyConcepts||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><h3>学习目标</h3><ul>${(l.objectives||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>课程内容</h3><p>${esc(l.content)}</p>${ex?`<div class="exercise"><h3>练习</h3><p>${esc(ex.prompt)}</p><textarea id="answer" placeholder="输入你的答案…">${esc(old)}</textarea><br><button onclick="submitAnswer('${esc(l.id)}','${esc(ex.id)}')">提交并保存</button><div class="feedback" id="feedback">${esc(progress[key]?.feedback||'')}</div></div>`:''}`}
function selectLesson(i){current=i;renderNav();render()}
async function submitAnswer(l,e){let answer=document.getElementById('answer').value.trim(); if(!answer)return; let r=await get('/api/progress',{method:'POST',headers:{'Content-Type':'application/json','X-Learner':learner},body:JSON.stringify({lesson_id:l,exercise_id:e,answer})}); progress[l+':'+e]=r; document.getElementById('feedback').textContent=r.feedback; renderNav()}
(async()=>{try{course=await get('/api/course'); document.getElementById('subtitle').textContent=course.title+' · '+course.lessons.length+' 课'; let p=await get('/api/progress',{headers:{'X-Learner':learner}}); p.items.forEach(x=>progress[x.lesson_id+':'+x.exercise_id]=x); renderNav();render()}catch(e){document.getElementById('content').textContent='加载失败：'+e}})();
</script></body></html>
