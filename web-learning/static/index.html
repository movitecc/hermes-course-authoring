<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes 互动学习</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--muted:#5b6780;--accent:#075985;--ok:#15803d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8fafc,#eaf2ff);font:16px/1.65 system-ui,sans-serif;color:#172033}header{padding:28px max(20px,calc((100% - 1100px)/2));border-bottom:1px solid #d8e1f0;background:#ffffffcc}.card{background:var(--card);border:1px solid #d7e0ef;border-radius:14px;padding:20px;box-shadow:0 8px 30px #35507018}button{border:0;border-radius:9px;padding:10px 14px;background:#2563eb;color:white;cursor:pointer}button:hover{background:#1d4ed8}.lesson{display:block;width:100%;text-align:left;background:transparent;color:#243452;margin:5px 0}.lesson.active{background:#dbeafe;color:#1e3a8a}.muted{color:var(--muted)}h1{margin:0 0 4px}h2{color:var(--accent)}h3{margin-bottom:5px}.pill{display:inline-block;background:#e0f2fe;color:#075985;padding:3px 9px;border-radius:999px;font-size:13px;margin:3px}.exercise{margin-top:22px;border-top:1px solid #d7e0ef;padding-top:18px}textarea{width:100%;min-height:120px;background:#fbfdff;color:#172033;border:1px solid #b9c7dc;border-radius:8px;padding:12px;font:inherit}.feedback{color:var(--ok);margin-top:10px}.progress{height:8px;background:#dbe4f2;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:var(--ok);width:0} .teaching-section{margin:18px 0;padding:16px 18px;border-left:4px solid #60a5fa;background:#f8fbff;border-radius:8px}.teaching-section h3{color:#174a7e;margin-top:0}.example{margin-top:10px;padding:10px 12px;background:#eff6ff;border-radius:7px}.simulator{margin-top:16px;padding:15px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:9px}.simulator select{padding:7px;margin:3px;border:1px solid #94a3b8;border-radius:6px}.simulator code{font-size:22px;background:#e0f2fe;padding:3px 10px;border-radius:6px}.scene-shell{margin-top:18px;border:1px solid #cbd5e1;border-radius:12px;padding:18px;background:#fff}.scene-meta{font-size:13px;color:#64748b}.scene-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.scene-option{background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe}.scene-option:hover{background:#dbeafe}.scene-feedback{margin-top:14px;padding:12px;border-radius:8px;background:#f0fdf4;color:#166534}.scene-progress{height:6px;background:#e2e8f0;border-radius:5px;margin:8px 0 16px}.scene-progress i{display:block;height:100%;background:#2563eb;border-radius:5px}.misconception{margin-top:10px;padding:10px 12px;background:#fff1f2;border-left:4px solid #fb7185;border-radius:7px}.check{margin-top:10px;padding:10px 12px;background:#f0fdf4;border-radius:7px}.hint{margin:16px 0;padding:12px;background:#fff7ed;border-left:4px solid #fb923c;border-radius:7px}.lesson-nav{display:flex;justify-content:space-between;margin-top:22px}.lesson-nav button:disabled{background:#cbd5e1;cursor:not-allowed}.premium{margin-top:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.premium input{padding:9px;border:1px solid #b9c7dc;border-radius:7px;max-width:150px} @media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{order:2}}
</style></head>
<body><header><h1>Hermes 互动学习</h1><div class="muted" id="subtitle">正在加载课程…</div><div id="premium" class="premium"><strong>高级模式</strong>：<input id="puser" placeholder="用户名"><input id="ppass" type="password" placeholder="密码"><button onclick="premiumLogin()">登录 AI 功能</button><button onclick="aiExplain()">AI 讲解</button><button onclick="aiPlan()">个性化计划</button><span id="premiumMsg" class="muted"></span></div></header><main><div class="layout"><aside class="card sidebar"><h3>课程目录</h3><div class="progress"><i id="bar"></i></div><p class="muted" id="status">进度加载中…</p><div id="lessons"></div></aside><section class="card"><div id="content">正在加载…</div></section></div></main>
<script>
let course, current=0, progress={}; const learner=localStorage.getItem('hermes_learner')||(()=>{let id='learner-'+crypto.randomUUID(); localStorage.setItem('hermes_learner',id); return id})();
const BASE=location.pathname.startsWith('/learn')?'/learn':'';
async function get(url, opt={}){let r=await fetch(BASE+url,opt); if(!r.ok) throw Error(await r.text()); return r.json()}
function premiumHeaders(){let token=sessionStorage.getItem('hermes_premium'); return token?{Authorization:'Basic '+token}:{} }
async function premiumRequest(path, body){let opt={headers:{...premiumHeaders(),'Content-Type':'application/json'}}; if(body){opt.method='POST';opt.body=JSON.stringify(body)} return get(path,opt)}
async function premiumLogin(){let u=document.getElementById('puser').value,p=document.getElementById('ppass').value;sessionStorage.setItem('hermes_premium',btoa(u+':'+p));try{await premiumRequest('/api/premium/status');if(u==='movit')localStorage.setItem('hermes_learner','telegram-870720339');document.getElementById('premiumMsg').textContent='高级模式已登录';}catch(e){sessionStorage.removeItem('hermes_premium');document.getElementById('premiumMsg').textContent='登录失败，请检查账号密码';}}
async function aiGrade(question){let answer=document.getElementById('answer').value.trim();if(!answer){document.getElementById('premiumMsg').textContent='请先输入答案';return}try{let r=await premiumRequest('/api/ai/grade',{question,answer});document.getElementById('feedback').textContent=r.content}catch(e){document.getElementById('premiumMsg').textContent='高级模式未登录或 Hermes 暂不可用'}}
async function aiExplain(){await aiAction('/api/ai/explain','AI 讲解')}
async function aiPlan(){await aiAction('/api/ai/plan','个性化学习计划')}
async function aiAction(path,title){let box=document.getElementById('premiumMsg');box.textContent=title+'生成中…';try{let r=await premiumRequest(path);box.textContent='';document.getElementById('content').innerHTML='<h2>'+title+'</h2><div style="white-space:pre-wrap">'+esc(r.content)+'</div>'}catch(e){box.textContent='高级模式未登录或 Hermes 暂不可用';}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderNav(){let done=Object.values(progress).filter(x=>x.completed).length; let total=course.lessons.reduce((n,l)=>n+(l.exercises||[]).length,0); document.getElementById('status').textContent=`已完成 ${done}/${total} 个练习`; document.getElementById('bar').style.width=(total?done/total*100:0)+'%'; document.getElementById('lessons').innerHTML=course.lessons.map((l,i)=>`<button class="lesson ${i===current?'active':''}" onclick="selectLesson(${i})">${i+1}. ${esc(l.title)}</button>`).join('')}
let sceneIndex=0;let sceneFeedback='';
function simulationBody(m){if(!m)return '';if(m.model==='gate_fault')return `<div class="simulator"><p><strong>电路：</strong>Y = A AND B　<strong>故障：</strong>B stuck-at-0</p><label>A <select id="simA"><option value="0">0</option><option value="1">1</option></select></label> <label>B <select id="simB"><option value="0">0</option><option value="1">1</option></select></label> <button onclick="runGateSim()">运行</button><div id="simResult"></div></div>`;if(m.model==='scan_chain')return `<div class="simulator"><p><strong>3 位 Scan Chain</strong>（初始 Q2Q1Q0=000）</p><p>当前状态：<code id="scanState">000</code></p><label>SI <select id="scanSI"><option value="0">0</option><option value="1">1</option></select></label> <button onclick="shiftScan()">Shift 一个时钟</button> <button onclick="captureScan()">Capture</button> <button onclick="resetScan()">复位</button><div id="scanResult"></div></div>`;if(m.model==='atpg')return `<div class="simulator"><p><strong>${esc(m.equation)}</strong>，故障：${esc(m.fault)}</p><label>A <select id="atpgA"><option value="0">0</option><option value="1">1</option></select></label> <label>B <select id="atpgB"><option value="0">0</option><option value="1">1</option></select></label> <label>C <select id="atpgC"><option value="0">0</option><option value="1">1</option></select></label> <button onclick="runAtpg()">比较好电路/故障电路</button><div id="atpgResult"></div></div>`;if(m.model==='observability')return `<div class="simulator"><p>点击路径节点，判断测试信号能否到达 X 并从 Y 观察。</p><div class="scene-actions">${m.nodes.map((x,i)=>`<button class="scene-option" onclick="observeNode(${i})">${esc(x)}</button>`).join('')}</div><div id="obsResult"></div></div>`;return ''}
function runGateSim(){let a=+document.getElementById('simA').value,b=+document.getElementById('simB').value,good=a&b,fault=a&0;document.getElementById('simResult').innerHTML=`<div class="scene-feedback">无故障：Y=${good}；故障：Y=${fault}。${good!==fault?'输出不同，故障被激活并传播。':'输出相同，故障被掩盖。'}</div>`}
let scanState='000';function shiftScan(){let si=document.getElementById('scanSI').value;scanState=scanState.slice(1)+si;document.getElementById('scanState').textContent=scanState;document.getElementById('scanResult').innerHTML='<div class="scene-feedback">Shift：每个触发器接收前一级状态，SI 进入最低位。</div>'}function captureScan(){scanState='101';document.getElementById('scanState').textContent=scanState;document.getElementById('scanResult').innerHTML='<div class="scene-feedback">Capture：关闭扫描路径，组合逻辑响应被锁存到触发器。</div>'}function resetScan(){scanState='000';document.getElementById('scanState').textContent=scanState;document.getElementById('scanResult').textContent=''}
function runAtpg(){let a=+document.getElementById('atpgA').value,b=+document.getElementById('atpgB').value,c=+document.getElementById('atpgC').value,good=(a&b)|c,fault=(a&0)|c;document.getElementById('atpgResult').innerHTML=`<div class="scene-feedback">好电路 Y=${good}；B stuck-at-0 时 Y=${fault}。${good!==fault?'检测成功：B=1 激活故障，A=1 且 C=0 使差异传播。':'检测失败：故障未激活或被 C 旁路。'}</div>`}function observeNode(i){document.getElementById('obsResult').innerHTML=`<div class="scene-feedback">${i===3?'到达内部节点 X：现在可以讨论如何把 X 的效应传播到 Y。':'这是路径上的节点。继续追踪信号，不能只看到达 X，还要确认响应能被输出观察。'}</div>`}
function sceneBody(s){let out=`<div class="scene-meta">场景 ${sceneIndex+1}/${course.lessons[current].scenes.length} · ${esc(s.goal||'')}</div><h3>${esc(s.title)}</h3><p>${esc(s.content||'')}</p>`;if(s.reference)out+=`<div class="example"><strong>白板/算例：</strong><p>${esc(s.reference)}</p></div>`;if(s.steps?.length)out+=`<ol>${s.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;if(s.model)out+=simulationBody(s.model);if(s.options)out+=`<div class="scene-actions">${s.options.map((x,i)=>`<button class="scene-option" onclick="answerScene(${i})">${esc(x)}</button>`).join('')}</div>`;if(sceneFeedback)out+=`<div class="scene-feedback">${esc(sceneFeedback)}</div>`;return out}
function answerScene(i){let s=course.lessons[current].scenes[sceneIndex];sceneFeedback=(i===s.correct?'✓ '+(s.feedback||'回答正确，请说明你的推理。'):'还不能进入下一步。请重新检查题目中的因果条件，再做一次预测。');render()}
function nextScene(){let total=course.lessons[current].scenes.length;if(sceneIndex<total-1){sceneIndex++;sceneFeedback='';render()}else if(current<course.lessons.length-1){current++;sceneIndex=0;sceneFeedback='';renderNav();render()}}
function prevScene(){if(sceneIndex>0){sceneIndex--;sceneFeedback='';render()}else if(current>0){current--;sceneIndex=course.lessons[current].scenes.length-1;sceneFeedback='';renderNav();render()}}
function render(){let l=course.lessons[current],ex=(l.exercises||[])[0],key=l.id+':'+(ex?.id||'lesson'),old=progress[key]?.answer||'',scenes=l.scenes||[],s=scenes[sceneIndex]||{};document.getElementById('content').innerHTML=`<h2>${esc(l.title)}</h2><p class="muted">第 ${current+1} 课 / 共 ${course.lessons.length} 课</p><div>${(l.keyConcepts||[]).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><div class="scene-progress"><i style="width:${scenes.length?(sceneIndex+1)/scenes.length*100:0}%"></i></div><div class="scene-shell">${sceneBody(s)}<div class="scene-actions"><button onclick="prevScene()" ${current===0&&sceneIndex===0?'disabled':''}>上一场景</button><button onclick="nextScene()">${sceneIndex===scenes.length-1?'进入下一课':'下一场景'}</button></div></div>${sceneIndex===scenes.length-1&&ex?`<div class="exercise"><h3>课堂迁移练习</h3><p>${esc(ex.prompt)}</p><textarea id="answer" placeholder="先写出你的推理过程，再给出答案…">${esc(old)}</textarea><br><button onclick="submitAnswer('${esc(l.id)}','${esc(ex.id)}')">提交并保存</button> <button onclick="aiGrade('${esc(ex.prompt)}')">高级 AI 批改</button><div class="feedback" id="feedback">${esc(progress[key]?.feedback||'')}</div></div>`:''}`}
function selectLesson(i){current=i;sceneIndex=0;sceneFeedback='';renderNav();render()}
async function submitAnswer(l,e){let answer=document.getElementById('answer').value.trim(); if(!answer)return; let r=await get('/api/progress',{method:'POST',headers:{'Content-Type':'application/json','X-Learner':learner},body:JSON.stringify({lesson_id:l,exercise_id:e,answer})}); progress[l+':'+e]=r; document.getElementById('feedback').textContent=r.feedback; renderNav()}
(async()=>{try{course=await get('/api/course'); document.getElementById('subtitle').textContent=course.title+' · '+course.lessons.length+' 课'; let p=await get('/api/progress',{headers:{'X-Learner':learner}}); p.items.forEach(x=>progress[x.lesson_id+':'+x.exercise_id]=x); renderNav();render()}catch(e){document.getElementById('content').textContent='加载失败：'+e}})();
</script></body></html>
