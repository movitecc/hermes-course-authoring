<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes 互动学习</title>
<style>
:root{color-scheme:light;--bg:#f5f7fb;--card:#ffffff;--muted:#5b6780;--accent:#075985;--ok:#15803d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8fafc,#eaf2ff);font:16px/1.65 system-ui,sans-serif;color:#172033}header{padding:28px max(20px,calc((100% - 1100px)/2));border-bottom:1px solid #d8e1f0;background:#ffffffcc}.card{background:var(--card);border:1px solid #d7e0ef;border-radius:14px;padding:20px;box-shadow:0 8px 30px #35507018}button{border:0;border-radius:9px;padding:10px 14px;background:#2563eb;color:white;cursor:pointer}button:hover{background:#1d4ed8}.lesson{display:block;width:100%;text-align:left;background:transparent;color:#243452;margin:5px 0}.lesson.active{background:#dbeafe;color:#1e3a8a}.muted{color:var(--muted)}h1{margin:0 0 4px}h2{color:var(--accent)}h3{margin-bottom:5px}.pill{display:inline-block;background:#e0f2fe;color:#075985;padding:3px 9px;border-radius:999px;font-size:13px;margin:3px}.exercise{margin-top:22px;border-top:1px solid #d7e0ef;padding-top:18px}textarea{width:100%;min-height:120px;background:#fbfdff;color:#172033;border:1px solid #b9c7dc;border-radius:8px;padding:12px;font:inherit}.feedback{color:var(--ok);margin-top:10px}.progress{height:8px;background:#dbe4f2;border-radius:5px;overflow:hidden}.progress i{display:block;height:100%;background:var(--ok);width:0} .teaching-section{margin:18px 0;padding:16px 18px;border-left:4px solid #60a5fa;background:#f8fbff;border-radius:8px}.teaching-section h3{color:#174a7e;margin-top:0}.example{margin-top:10px;padding:10px 12px;background:#eff6ff;border-radius:7px}.simulator{margin-top:16px;padding:15px;background:#f8fafc;border:1px solid #cbd5e1;border-radius:9px}.simulator select{padding:7px;margin:3px;border:1px solid #94a3b8;border-radius:6px}.simulator code{font-size:22px;background:#e0f2fe;padding:3px 10px;border-radius:6px}.route{margin:14px 0;padding:12px 14px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;color:#164e63;font-size:14px}.context{margin:14px 0;padding:14px 16px;background:#fffbeb;border-left:4px solid #f59e0b;border-radius:8px}.scene-shell{margin-top:18px;border:1px solid #cbd5e1;border-radius:12px;padding:18px;background:#fff}.scene-meta{font-size:13px;color:#64748b}.scene-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.scene-option{background:#eff6ff;color:#1e3a8a;border:1px solid #bfdbfe}.scene-option:hover{background:#dbeafe}.scene-feedback{margin-top:14px;padding:12px;border-radius:8px;background:#f0fdf4;color:#166534}.scene-progress{height:6px;background:#e2e8f0;border-radius:5px;margin:8px 0 16px}.scene-progress i{display:block;height:100%;background:#2563eb;border-radius:5px}.misconception{margin-top:10px;padding:10px 12px;background:#fff1f2;border-left:4px solid #fb7185;border-radius:7px}.check{margin-top:10px;padding:10px 12px;background:#f0fdf4;border-radius:7px}.hint{margin:16px 0;padding:12px;background:#fff7ed;border-left:4px solid #fb923c;border-radius:7px}.lesson-nav{display:flex;justify-content:space-between;margin-top:22px}.lesson-nav button:disabled{background:#cbd5e1;cursor:not-allowed}.premium{margin-top:12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.premium input{padding:9px;border:1px solid #b9c7dc;border-radius:7px;max-width:150px}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;max-width:1100px;margin:24px auto;padding:0 20px} @media(max-width:760px){.layout{grid-template-columns:1fr}.sidebar{order:2}}.ai-panel{margin:0 0 18px;border:1px solid #bae6fd;border-radius:10px;background:#f0f9ff;padding:14px 16px}.ai-panel-head{display:flex;justify-content:space-between;align-items:center;color:#164e63}.ai-panel-close{background:#e0f2fe;color:#075985;padding:4px 10px}.ai-panel-close:hover{background:#bae6fd}.ai-panel-body{white-space:pre-wrap;margin-top:8px}
</style></head>
<body><header><h1>Hermes 互动学习</h1><div class="muted" id="subtitle">正在加载课程…</div><div id="premium" class="premium"><strong>高级模式</strong>：<input id="puser" placeholder="用户名"><input id="ppass" type="password" placeholder="密码"><button onclick="premiumLogin()">登录 AI 功能</button><button onclick="aiExplain()">AI 讲解</button><button onclick="aiPlan()">个性化计划</button><span id="premiumMsg" class="muted"></span></div></header><main><div class="layout"><aside class="card sidebar"><h3>课程目录</h3><div class="progress"><i id="bar"></i></div><p class="muted" id="status">进度加载中…</p><div id="lessons"></div></aside><section class="card"><div id="aiPanel" class="ai-panel" hidden></div><div id="content">正在加载…</div></section></div></main>
<script src="logic.js"></script>
<script src="app.js"></script></body></html>
